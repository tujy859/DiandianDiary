<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="603.9375" viewBox="0 0 1040 603.9375"><foreignObject width="100%" height="100%"><html xmlns="http://www.w3.org/1999/xhtml"><head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FAF8F3;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      color: #1C2E24;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #canvas-container {
      width: 1040px;
      background: #FAF8F3;
      border: 1px solid #DFD9CE;
      border-radius: 16px;
      padding: 24px 24px 20px 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background: #EBF3EE;
      color: #2F6048;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 12px;
      border: 1px solid #B8D0C2;
      margin-bottom: 6px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1D382A;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #647269;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 18px;
    }
    .col {
      background: #FFFFFF;
      border: 1.5px solid #D6E2DB;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .col-header {
      background: #EBF3EE;
      border-bottom: 1.5px solid #D6E2DB;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .col-title {
      font-size: 15px;
      font-weight: 700;
      color: #1D382A;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .col-icon {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 20px;
      height: 20px;
      background: #2F6048;
      color: #FFF;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .col-tag {
      font-size: 11px;
      font-weight: 600;
      color: #8F4212;
      background: #FFF5EB;
      border: 1px solid #F3C9A5;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .col-role {
      font-size: 11.5px;
      color: #647269;
      margin-top: 2px;
    }
    .col-body {
      padding: 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .item-card {
      background: #FAF8F3;
      border: 1px solid #E6E0D5;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .item-card h4 {
      font-size: 12.5px;
      font-weight: 700;
      color: #243E30;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #2F6048;
    }
    .dot.orange {
      background: #D97336;
    }
    .item-card p {
      font-size: 11.5px;
      color: #4C5D53;
      line-height: 1.48;
    }
    .footer-bar {
      background: #F4F8F5;
      border: 1px solid #CCE0D5;
      border-radius: 10px;
      padding: 9px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #2F4D3C;
      white-space: nowrap;
    }
    .footer-pill {
      background: #2F6048;
      color: #FFFFFF;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
    }
    .footer-pill.orange {
      background: #D97336;
    }
  </style>
<style>body{padding:0;display:block}#canvas-container{width:1040px;padding:24px}.header{margin-bottom:22px}.title{font-size:25px;letter-spacing:0}.grid{gap:18px}.col-title,.card-title,.zone-title{font-size:22px}.col-role{font-size:18px;margin-top:5px}.col-header,.card-header,.zone-header{padding:13px}.col-body,.card-body,.zone-body{padding:13px;gap:10px}.item-card{padding:11px}.item-card h4,.box h5,.node-box h5{font-size:19px;line-height:1.4;margin-bottom:6px}.item-card p,.box p,.node-box p{font-size:18px;line-height:1.55}.card-body .box,.node-box{padding:11px}.b-tag,.b-desc{font-size:17px;line-height:1.4}.b-tag{white-space:nowrap;padding:3px 6px}.branch-card{padding:8px;gap:8px}.step-num{font-size:18px}.arch-grid{grid-template-columns:1.15fr 1fr;gap:18px}.dot{display:none}.col-icon{font-size:18px}.branch-group{gap:10px}</style></head>
<body>
  <div id="canvas-container">
    <div class="header">

      <h1 class="title">三个入口的功能分工</h1>

    </div>

    <div class="grid">
      <!-- 聊聊 -->
      <div class="col">
        <div class="col-header">
          <div>
            <div class="col-title"><span class="col-icon">1</span> 聊聊</div>
            <div class="col-role">表达与查询</div>
          </div>

        </div>
        <div class="col-body">
          <div class="item-card">
            <h4>文字与照片</h4>
            <p>随手说一句，发一张照片</p>
          </div>
          <div class="item-card">
            <h4>待确认草稿</h4>
            <p>核对日期与正文后保存</p>
          </div>
          <div class="item-card">
            <h4>历史查询</h4>
            <p>查日期，并打开原记录</p>
          </div>
          <div class="item-card">
            <h4>话题上下文</h4>
            <p>按需读取前文与历史话题</p>
          </div>
        </div>
      </div>

      <!-- 时光册 -->
      <div class="col">
        <div class="col-header">
          <div>
            <div class="col-title"><span class="col-icon">2</span> 时光册</div>
            <div class="col-role">浏览与回看</div>
          </div>

        </div>
        <div class="col-body">
          <div class="item-card">
            <h4>竖线时间轴</h4>
            <p>按发生日期回看日常</p>
          </div>
          <div class="item-card">
            <h4>照片画廊</h4>
            <p>同一批日记的照片视角</p>
          </div>
          <div class="item-card">
            <h4>日记管理</h4>
            <p>查看、编辑与逻辑删除</p>
          </div>
          <div class="item-card">
            <h4>原文对照</h4>
            <p>整理正文与原始输入并存</p>
          </div>
        </div>
      </div>

      <!-- 我的 -->
      <div class="col">
        <div class="col-header">
          <div>
            <div class="col-title"><span class="col-icon">3</span> 我的</div>
            <div class="col-role">档案与配置</div>
          </div>

        </div>
        <div class="col-body">
          <div class="item-card">
            <h4>宠物档案</h4>
            <p>照片与三款内置头像</p>
          </div>
          <div class="item-card">
            <h4>家庭空间</h4>
            <p>邀请家人，共享宠物日记</p>
          </div>
          <div class="item-card">
            <h4>模型连接</h4>
            <p>云开发 AI 或自定义 API</p>
          </div>
          <div class="item-card">
            <h4>身份隔离</h4>
            <p>按账号与家庭管理缓存</p>
          </div>
        </div>
      </div>
    </div>


  </div>

</body></html></foreignObject></svg>
