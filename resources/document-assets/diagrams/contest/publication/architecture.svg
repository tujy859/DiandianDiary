<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="778.5" viewBox="0 0 1040 778.5"><foreignObject width="100%" height="100%"><html xmlns="http://www.w3.org/1999/xhtml"><head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FAF8F3;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      color: #1C2E24;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #canvas-container {
      width: 1040px;
      background: #FAF8F3;
      border: 1px solid #DFD9CE;
      border-radius: 16px;
      padding: 24px 26px 20px 26px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background: #EBF3EE;
      color: #2F6048;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 12px;
      border: 1px solid #B8D0C2;
      margin-bottom: 6px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1D382A;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #647269;
    }
    .arch-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      grid-template-rows: auto auto;
      gap: 16px;
      margin-bottom: 18px;
    }
    .zone {
      background: #FFFFFF;
      border: 1.5px solid #D6E2DB;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .zone.orange {
      border-color: #F3C9A5;
      background: #FFFDFC;
    }
    .zone-header {
      padding: 10px 14px;
      background: #EBF3EE;
      border-bottom: 1.5px solid #D6E2DB;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .zone-header.orange {
      background: #FFF5EB;
      border-bottom: 1.5px solid #F3C9A5;
    }
    .zone-header.green {
      background: #E2ECE5;
      border-bottom: 1.5px solid #B4CFC0;
    }
    .zone-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #1D382A;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .zone-title.orange {
      color: #8F4212;
    }
    .zone-tag {
      font-size: 10.5px;
      font-weight: 600;
      color: #2F6048;
      background: #FFF;
      border: 1px solid #B8D0C2;
      padding: 1px 6px;
      border-radius: 6px;
    }
    .zone-tag.orange {
      color: #8F4212;
      border: 1px solid #F3C9A5;
    }
    .zone-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .node-box {
      background: #FAF8F3;
      border: 1px solid #E6E0D5;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .node-box.orange {
      background: #FFF8F2;
      border: 1px solid #F5D5BE;
    }
    .node-box.green {
      background: #F2F8F4;
      border: 1px solid #C5DFD0;
    }
    .node-box h5 {
      font-size: 12.5px;
      font-weight: 700;
      color: #243E30;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .node-box h5.orange {
      color: #8F4212;
    }
    .node-box p {
      font-size: 11.5px;
      color: #4C5D53;
      line-height: 1.45;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #2F6048;
    }
    .dot.orange {
      background: #D97336;
    }
    .footer-bar {
      background: #F4F8F5;
      border: 1px solid #CCE0D5;
      border-radius: 10px;
      padding: 9px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #2F4D3C;
      white-space: nowrap;
    }
    .footer-pill {
      background: #2F6048;
      color: #FFFFFF;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
    }
    .footer-pill.orange {
      background: #D97336;
    }
  </style>
<style>body{padding:0;display:block}#canvas-container{width:1040px;padding:24px}.header{margin-bottom:22px}.title{font-size:25px;letter-spacing:0}.grid{gap:18px}.col-title,.card-title,.zone-title{font-size:22px}.col-role{font-size:18px;margin-top:5px}.col-header,.card-header,.zone-header{padding:13px}.col-body,.card-body,.zone-body{padding:13px;gap:10px}.item-card{padding:11px}.item-card h4,.box h5,.node-box h5{font-size:19px;line-height:1.4;margin-bottom:6px}.item-card p,.box p,.node-box p{font-size:18px;line-height:1.55}.card-body .box,.node-box{padding:11px}.b-tag,.b-desc{font-size:17px;line-height:1.4}.b-tag{white-space:nowrap;padding:3px 6px}.branch-card{padding:8px;gap:8px}.step-num{font-size:18px}.arch-grid{grid-template-columns:1.15fr 1fr;gap:18px}.dot{display:none}.col-icon{font-size:18px}.branch-group{gap:10px}</style></head>
<body>
  <div id="canvas-container">
    <div class="header">

      <h1 class="title">模型 程序 用户与云端的分工</h1>

    </div>

    <div class="arch-grid">
      <!-- Zone 1: 客户端 Agent 与校验 -->
      <div class="zone" style="grid-row: span 2;">
        <div class="zone-header">
          <div class="zone-title">客户端工具与校验</div>

        </div>
        <div class="zone-body">
          <div class="node-box">
            <h5>交互页面</h5>
            <p>聊聊 · 时光册 · 我的</p>
          </div>
          <div class="node-box">
            <h5>客户端 Agent</h5>
            <p>组织上下文，选择工具路径</p>
          </div>
          <div class="node-box">
            <h5>四项工具</h5>
            <p>查询记录 / 生成草稿<br />读取当前话题 / 读取历史话题</p>
          </div>
          <div class="node-box green">
            <h5>程序校验与计算</h5>
            <p>核对文字出处与日期<br />限定宠物范围，生成条数与引用</p>
          </div>
        </div>
      </div>

      <!-- Zone 2: 模型服务 -->
      <div class="zone orange">
        <div class="zone-header orange">
          <div class="zone-title orange">模型服务</div>

        </div>
        <div class="zone-body">
          <div class="node-box orange">
            <h5 class="orange">微信云开发 AI / 自定义 API</h5>
            <p>理解表达，选择工具，整理文字<br />模型没有直接保存日记的工具</p>
          </div>
        </div>
      </div>

      <!-- Zone 3 & 4 Right Column: 本机已同步缓存 & 家庭云端 -->
      <div class="zone">
        <div class="zone-header green">
          <div class="zone-title">记录与数据访问</div>

        </div>
        <div class="zone-body">
          <div class="node-box green">
            <h5>本机已同步缓存</h5>
            <p>查询读取当前宠物的已同步记录<br />按账号与家庭隔离</p>
          </div>
          <div class="node-box">
            <h5>云函数 diaryApi</h5>
            <p>处理微信身份与家庭权限<br />用户确认后保存，管理照片访问</p>
          </div>
          <div class="node-box">
            <h5>家庭云端</h5>
            <p>保存宠物档案、日记与私有照片<br />整理结果与原始输入并存</p>
          </div>
        </div>
      </div>
    </div>


  </div>

</body></html></foreignObject></svg>
