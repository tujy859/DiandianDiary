<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="596.125" viewBox="0 0 1040 596.125">
  <foreignObject width="100%" height="100%">
    <!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FAF8F3;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      color: #1C2E24;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #canvas-container {
      width: 1040px;
      background: #FAF8F3;
      border: 1px solid #DFD9CE;
      border-radius: 16px;
      padding: 24px 24px 20px 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background: #EBF3EE;
      color: #2F6048;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 12px;
      border: 1px solid #B8D0C2;
      margin-bottom: 6px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1D382A;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #647269;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 18px;
    }
    .col {
      background: #FFFFFF;
      border: 1.5px solid #D6E2DB;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .col-header {
      background: #EBF3EE;
      border-bottom: 1.5px solid #D6E2DB;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .col-title {
      font-size: 15px;
      font-weight: 700;
      color: #1D382A;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .col-icon {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 20px;
      height: 20px;
      background: #2F6048;
      color: #FFF;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .col-tag {
      font-size: 11px;
      font-weight: 600;
      color: #8F4212;
      background: #FFF5EB;
      border: 1px solid #F3C9A5;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .col-role {
      font-size: 11.5px;
      color: #647269;
      margin-top: 2px;
    }
    .col-body {
      padding: 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .item-card {
      background: #FAF8F3;
      border: 1px solid #E6E0D5;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .item-card h4 {
      font-size: 12.5px;
      font-weight: 700;
      color: #243E30;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #2F6048;
    }
    .dot.orange {
      background: #D97336;
    }
    .item-card p {
      font-size: 11.5px;
      color: #4C5D53;
      line-height: 1.48;
    }
    .footer-bar {
      background: #F4F8F5;
      border: 1px solid #CCE0D5;
      border-radius: 10px;
      padding: 9px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #2F4D3C;
      white-space: nowrap;
    }
    .footer-pill {
      background: #2F6048;
      color: #FFFFFF;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
    }
    .footer-pill.orange {
      background: #D97336;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div class="header">
      <div class="badge">记一下喵 · 产品结构</div>
      <h1 class="title">小程序三大主入口与功能划分</h1>
      <p class="subtitle">以聊天为交互界面的宠物生活陪伴与成长记录空间</p>
    </div>

    <div class="grid">
      <!-- 聊聊 -->
      <div class="col">
        <div class="col-header">
          <div>
            <div class="col-title"><span class="col-icon">1</span> 聊聊</div>
            <div class="col-role">承担表达与查询</div>
          </div>
          <span class="col-tag">核心交互</span>
        </div>
        <div class="col-body">
          <div class="item-card">
            <h4><span class="dot"></span> 文字与照片输入</h4>
            <p>日常随笔、护理原话与生活照片输入；提供快捷问题入口。</p>
          </div>
          <div class="item-card">
            <h4><span class="dot orange"></span> 待确认草稿与出处校验</h4>
            <p>AI 辅助整理正文与标签；逐字核对文字原文，日期不明待补充；纯照片免文字出处。</p>
          </div>
          <div class="item-card">
            <h4><span class="dot"></span> 当前宠物日记查询</h4>
            <p>按事件与日期查询已同步日记；提供日期、距今天数与原记录入口。</p>
          </div>
          <div class="item-card">
            <h4><span class="dot"></span> 话题上下文与历史回看</h4>
            <p>默认 12000 字符预算，较早消息分页取回；支持历史话题按目录回看。</p>
          </div>
        </div>
      </div>

      <!-- 时光册 -->
      <div class="col">
        <div class="col-header">
          <div>
            <div class="col-title"><span class="col-icon">2</span> 时光册</div>
            <div class="col-role">承担浏览与回看</div>
          </div>
          <span class="col-tag">温存回看</span>
        </div>
        <div class="col-body">
          <div class="item-card">
            <h4><span class="dot"></span> 时间轴与连续陪伴</h4>
            <p>按发生日期倒序排列生活足迹；保留竖线与圆点，突出事件先后。</p>
          </div>
          <div class="item-card">
            <h4><span class="dot orange"></span> 照片画廊集中展示</h4>
            <p>以照片为中心集中浏览成长瞬间；时间轴与画廊共用同一批日记记录。</p>
          </div>
          <div class="item-card">
            <h4><span class="dot"></span> 日记详情查阅与编辑</h4>
            <p>查阅完整日记与照片；支持二次编辑正文与日期，或安全删除记录。</p>
          </div>
          <div class="item-card">
            <h4><span class="dot"></span> 双重视角留存与宠物切换</h4>
            <p>同时保留模型整理正文与用户原始输入；按当前宠物独立展示记录。</p>
          </div>
        </div>
      </div>

      <!-- 我的 -->
      <div class="col">
        <div class="col-header">
          <div>
            <div class="col-title"><span class="col-icon">3</span> 我的</div>
            <div class="col-role">承担档案与配置</div>
          </div>
          <span class="col-tag">空间设置</span>
        </div>
        <div class="col-body">
          <div class="item-card">
            <h4><span class="dot"></span> 宠物成长档案与头像</h4>
            <p>多宠物档案管理；内置插画头像与自定义照片；品牌小猫与宠物身份分离。</p>
          </div>
          <div class="item-card">
            <h4><span class="dot orange"></span> 家庭空间与成员共享</h4>
            <p>邀请家人围绕同一只宠物共同记录；基于微信身份鉴权，多端数据同步。</p>
          </div>
          <div class="item-card">
            <h4><span class="dot"></span> 模型服务接入配置</h4>
            <p>支持微信云开发 AI 或自定义 API；两种来源共用相同的草稿与查询校验。</p>
          </div>
          <div class="item-card">
            <h4><span class="dot"></span> 本机缓存与安全保管</h4>
            <p>管理本机持久化已同步记录；敏感密钥本地保存；云端操作经 diaryApi 鉴权。</p>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-bar">
      <div class="footer-item">
        <span class="footer-pill">模型不直存</span>
        <span>模型仅生成草稿卡片，不能直接保存正式日记</span>
      </div>
      <div class="footer-item">
        <span class="footer-pill orange">用户主导</span>
        <span>用户确认后保存，永久保留原始输入出处</span>
      </div>
      <div class="footer-item">
        <span class="footer-pill">缓存检索</span>
        <span>查询读取当前宠物已同步缓存，非实时服务端检索</span>
      </div>
    </div>
  </div>
</body>
</html>
  </foreignObject>
</svg>