name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic-checks:
    name: Logic tests and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Check repository configuration and credentials
        # Run before installing dependencies; inspect only repository files.
        # This command requires Node.js but no npm packages.
        run: node check-repository-security.cjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check mini-program package and exported assets
        run: npm run check:package
      - name: Install cloud function SDK for adapter contract tests
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cloudfunctions/diaryApi
      - name: Check logic-layer types
        run: npm run typecheck
      - name: Run unit tests
        run: npm test -- --ci --runInBand
